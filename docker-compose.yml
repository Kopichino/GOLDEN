services:
  hapi-fhir:
    image: hapiproject/hapi:latest
    container_name: golden-hapi-fhir
    ports:
      - "8080:8080"
    environment:
      - hapi.fhir.fhir_version=R4
      - hapi.fhir.server_address=http://localhost:8080/fhir
      - hapi.fhir.tester.home.name=Local Tester
      - hapi.fhir.tester.home.server_address=http://localhost:8080/fhir
      - hapi.fhir.tester.home.fhir_version=R4
      - hapi.fhir.cors.allow_Credentials=true
      - hapi.fhir.cors.allowed_origin=*
      - SPRING_PROFILES_ACTIVE=default
      - JAVA_TOOL_OPTIONS=-Xms512m -Xmx1536m
    restart: unless-stopped
